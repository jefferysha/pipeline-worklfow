name: Release Tenon

on:
  workflow_call:
    inputs:
      tag:
        description: Candidate-created v-prefixed tag to package
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Resolve and validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "invalid release tag: $tag" >&2; exit 1 ;; esac
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          git checkout --detach "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"

      - name: Validate package versions
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          plugin_version="$(node -p "require('./.codex-plugin/plugin.json').version")"
          claude_version="$(node -p "require('./.claude-plugin/plugin.json').version")"
          [ "$version" = "$plugin_version" ] && [ "$version" = "$claude_version" ] || {
            echo "tag/plugin version mismatch: $version / $plugin_version / $claude_version" >&2
            exit 1
          }

      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run check:release-workflows
      - run: npm run check:identity
      - run: npm run check:repository-hygiene
      - run: npm run check:legacy-bridge
      - run: npm run check:npx-package
      - run: npm run build
      - run: bash tools/verify-skills.sh
      - run: bash tools/test-bundle.sh
      - name: Install pinned Codex CLI for public bootstrap acceptance
        run: npm install --global @openai/codex@0.144.1
      - name: Real clean Codex install through public bootstrap
        run: npm run test:clean-install:public -- --public-ref "$(git rev-parse HEAD)"

      - name: Package migration-only legacy bridge
        run: |
          npm run build:legacy-bridge
          tar -C .release -czf ".release/tenon-legacy-bridge-${{ steps.release.outputs.version }}.tar.gz" legacy-bridge

      - name: Build optional npx package
        if: vars.TENON_NPM_PACKAGE != ''
        env:
          TENON_NPM_PACKAGE: ${{ vars.TENON_NPM_PACKAGE }}
        run: |
          node tools/build-npx-package.mjs \
            --package-name "$TENON_NPM_PACKAGE" \
            --ref "${{ steps.release.outputs.tag }}" \
            --output .release/npx-package
          npm pack .release/npx-package --pack-destination .release

      - name: Publish optional npx package
        if: vars.TENON_NPM_PACKAGE != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm publish .release/npx-package --access public
          else
            echo "[HONEST SKIP] NPM_TOKEN 未配置；GitHub release 和 Marketplace 仍照常发布。"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(".release/tenon-legacy-bridge-${{ steps.release.outputs.version }}.tar.gz")
          for archive in .release/*.tgz; do
            [ -e "$archive" ] && assets+=("$archive")
          done
          gh release create "${{ steps.release.outputs.tag }}" "${assets[@]}" \
            --generate-notes \
            --title "Tenon ${{ steps.release.outputs.version }}"
