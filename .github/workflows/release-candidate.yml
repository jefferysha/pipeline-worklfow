name: Release candidate (pre-tag)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character main commit SHA to release
        required: true
      tag:
        description: New v-prefixed semver tag to create after every gate passes
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  pre-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Prove exact current main candidate and unused tag
        id: candidate
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_SHA" in
            *[!0-9a-fA-F]*|'') echo "ref must be a full hexadecimal commit SHA" >&2; exit 1 ;;
          esac
          [ "${#CANDIDATE_SHA}" -eq 40 ] || {
            echo "ref must contain exactly 40 hexadecimal characters" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "tag must be a complete stable v-prefixed SemVer" >&2
            exit 1
          }
          git fetch --force --no-tags origin main
          head="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          [ "$head" = "$CANDIDATE_SHA" ] && [ "$head" = "$main" ] || {
            echo "candidate drift: input=$CANDIDATE_SHA checkout=$head origin/main=$main" >&2
            exit 1
          }
          [ "$DISPATCH_SHA" = "$CANDIDATE_SHA" ] && [ "$WORKFLOW_SHA" = "$CANDIDATE_SHA" ] || {
            echo "workflow must be dispatched from the exact candidate main commit" >&2
            exit 1
          }
          [ "$WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml@refs/heads/main" ] || {
            echo "workflow definition is not owned by refs/heads/main: $WORKFLOW_REF" >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          root_version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./.codex-plugin/plugin.json').version")"
          claude_version="$(node -p "require('./.claude-plugin/plugin.json').version")"
          [ "$version" = "$root_version" ] &&
            [ "$version" = "$plugin_version" ] &&
            [ "$version" = "$claude_version" ] || {
              echo "version mismatch: tag=$version root=$root_version codex=$plugin_version claude=$claude_version" >&2
              exit 1
            }
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Block advisories and invalid, extraneous, or incompatible resolved trees
        run: npm run check:dependencies

      - name: Prove release workflow anti-bypass contract
        run: npm run check:release-workflows

      - name: Repository, identity, compatibility, and package gates
        run: |
          npm run check:comments
          npm run check:architecture
          npm run check:identity
          npm run check:repository-hygiene
          npm run check:npx-package
          npm run check:legacy-bridge
          npm run check:default-workflow-freshness

      - name: Build complete release payload and prove committed freshness
        run: |
          npm run build
          git diff --exit-code -- \
            packages/cli/dist/tenon.mjs \
            packages/server/dist/dashboard.mjs \
            packages/dashboard-app/dist
          bash tools/verify-skills.sh
          bash tools/test-bundle.sh

      - name: Documentation and governance-document gates
        run: |
          npm run check:docs
          npm run check:document-templates
          npm run docs:sync
          npm run docs:check
          npm run docs:build
          npm run docs:smoke

      - name: Full runtime, Dashboard, hook, adapter, migration, and oracle verification
        run: |
          npm test
          npm run test:web
          bash tools/test-hooks.sh
          bash tools/test-adapters.sh
          npm run test:migration-cas
          npm run oracle

      - name: Real clean Codex install from candidate checkout
        run: |
          npm install --global @openai/codex@0.144.1
          npm run test:clean-install

      - name: Re-prove main identity immediately before approval
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin main
          [ "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" ]
          [ "$(git rev-parse origin/main)" = "$CANDIDATE_SHA" ] || {
            echo "main advanced while the release candidate was running; rerun against the new exact SHA" >&2
            exit 1
          }

      - name: Prove canonical CI passed for exact candidate SHA
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          matching="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE_SHA&event=push&status=completed&per_page=100" \
              --jq '.workflow_runs[] | select(.event == "push" and .status == "completed" and .conclusion == "success") | .head_sha'
          )"
          printf '%s\n' "$matching" | grep -Fqx -- "$CANDIDATE_SHA" || {
            echo "canonical push CI has not succeeded for exact candidate: $CANDIDATE_SHA" >&2
            exit 1
          }

      - name: Write approval evidence for the default-branch writer
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_WORKFLOW_ID: ${{ github.workflow_ref }}
          SOURCE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p .release-candidate
          jq -n \
            --arg sha "$CANDIDATE_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_workflow_ref "$SOURCE_WORKFLOW_ID" \
            --arg source_workflow_sha "$SOURCE_WORKFLOW_SHA" \
            '{
              sha: $sha,
              tag: $tag,
              version: $version,
              source_run_id: $source_run_id,
              source_workflow_ref: $source_workflow_ref,
              source_workflow_sha: $source_workflow_sha
            }' > .release-candidate/approved.json

      - name: Publish approval evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-approval
          path: .release-candidate/approved.json
          if-no-files-found: error
          retention-days: 1
