name: Documentation Pages

on:
  pull_request:
    paths:
      - 'README*.md'
      - 'docs/usage/**'
      - 'docs-site/**'
      - 'tools/check-docs*'
      - 'tools/check-repository-hygiene*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  push:
    branches: [main]
    paths:
      - 'README*.md'
      - 'docs/usage/**'
      - 'docs-site/**'
      - 'tools/check-docs*'
      - 'tools/check-repository-hygiene*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:repository-hygiene
      - run: npm run docs:sync
      - run: npm run docs:check
      - run: npm run docs:build
      - run: npm run docs:smoke
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
