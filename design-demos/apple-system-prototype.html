<!doctype html>
<!--
  THROWAWAY PROTOTYPE — do not ship.
  Question: three complete-system IA variants for Pipeline, switchable with
  ?variant=A|B|C&page=overview|change|studio|operations|machine.
  Run: python3 -m http.server 18810 --bind 127.0.0.1 --directory design-demos
  The prototype is read-only. Buttons only navigate or open local demo sheets.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pipeline · Apple Design System Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f4f7;
      --bg-deep: #e9ebf0;
      --surface: rgba(255,255,255,.78);
      --surface-solid: #fff;
      --surface-2: rgba(248,249,252,.82);
      --ink: #15161a;
      --ink-2: #4a4d55;
      --ink-3: #81858f;
      --line: rgba(27,31,40,.10);
      --line-strong: rgba(27,31,40,.17);
      --blue: #0a68ff;
      --blue-2: #dceaff;
      --green: #168a4f;
      --green-bg: #e3f6ea;
      --amber: #a65f00;
      --amber-bg: #fff0d6;
      --red: #d62f3a;
      --red-bg: #ffe7e8;
      --violet: #7257d9;
      --shadow-sm: 0 1px 2px rgba(20,24,35,.04), 0 8px 22px rgba(20,24,35,.05);
      --shadow-lg: 0 20px 60px rgba(20,24,35,.16), 0 3px 12px rgba(20,24,35,.08);
      --radius: 18px;
      --radius-sm: 12px;
      --spring: cubic-bezier(.2,.85,.25,1);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      font-optical-sizing: auto;
    }

    :root.dark {
      color-scheme: dark;
      --bg: #101115;
      --bg-deep: #090a0c;
      --surface: rgba(31,33,39,.78);
      --surface-solid: #1d1f25;
      --surface-2: rgba(40,42,49,.78);
      --ink: #f5f6f8;
      --ink-2: #c5c8cf;
      --ink-3: #8d919b;
      --line: rgba(255,255,255,.10);
      --line-strong: rgba(255,255,255,.18);
      --blue: #4d94ff;
      --blue-2: rgba(35,105,210,.30);
      --green: #57c98b;
      --green-bg: rgba(34,139,86,.22);
      --amber: #f3ad4f;
      --amber-bg: rgba(170,99,14,.25);
      --red: #ff6d75;
      --red-bg: rgba(185,48,60,.24);
      --violet: #a895ff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.20), 0 10px 24px rgba(0,0,0,.18);
      --shadow-lg: 0 25px 80px rgba(0,0,0,.48), 0 3px 12px rgba(0,0,0,.30);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    html { background: var(--bg-deep); }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 18% -15%, rgba(61,126,255,.13), transparent 34rem),
        radial-gradient(circle at 92% 18%, rgba(131,93,255,.08), transparent 30rem),
        var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
      letter-spacing: 0;
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:active, .pressable:active { transform: scale(.975); transition-duration: 70ms !important; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 34%, transparent); outline-offset: 2px; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
    .muted { color: var(--ink-3); }
    .eyebrow { color: var(--ink-3); font-size: 11px; font-weight: 700; letter-spacing: .105em; text-transform: uppercase; }
    .glass { background: var(--surface); -webkit-backdrop-filter: blur(28px) saturate(160%); backdrop-filter: blur(28px) saturate(160%); }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
    .soft { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-height: 36px; border: 1px solid var(--line-strong); border-radius: 10px;
      background: var(--surface-solid); padding: 0 13px; cursor: pointer; font-weight: 650;
      transition: transform 140ms var(--spring), background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }
    .btn:hover { border-color: color-mix(in srgb, var(--blue) 42%, var(--line)); box-shadow: 0 5px 18px rgba(24,51,100,.08); }
    .btn.primary { border-color: transparent; background: var(--blue); color: #fff; }
    .btn.danger { border-color: color-mix(in srgb, var(--red) 35%, transparent); background: var(--red-bg); color: var(--red); }
    .btn.quiet { border-color: transparent; background: transparent; box-shadow: none; }
    .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 25px; padding: 0 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 650; white-space: nowrap; }
    .pill.blue { background: var(--blue-2); color: var(--blue); }
    .pill.green { background: var(--green-bg); color: var(--green); }
    .pill.amber { background: var(--amber-bg); color: var(--amber); }
    .pill.red { background: var(--red-bg); color: var(--red); }
    .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: currentColor; }
    .app { min-height: 100vh; }
    .page-in { animation: pageIn 420ms var(--spring) both; }
    @keyframes pageIn { from { opacity: .15; transform: translateY(8px) scale(.995); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }

    /* Shared journey language */
    .journey-map { display: grid; grid-template-columns: repeat(6,minmax(88px,1fr)); gap: 0; margin: 18px 0 0; overflow-x: auto; padding: 3px 2px 5px; }
    .journey-step { position: relative; min-width: 88px; padding: 0 9px; color: var(--ink-3); font-size: 11px; text-align: center; }
    .journey-step::before { content: ""; display: block; width: 10px; height: 10px; margin: 0 auto 8px; border: 2px solid var(--line-strong); border-radius: 50%; background: var(--surface-solid); position: relative; z-index: 1; }
    .journey-step::after { content: ""; position: absolute; top: 5px; left: calc(50% + 6px); width: calc(100% - 12px); height: 2px; background: var(--line); }
    .journey-step:last-child::after { display: none; }
    .journey-step.done { color: var(--green); }
    .journey-step.done::before { border-color: var(--green); background: var(--green); box-shadow: 0 0 0 5px var(--green-bg); }
    .journey-step.current { color: var(--blue); font-weight: 700; }
    .journey-step.current::before { border-color: var(--blue); background: var(--blue); box-shadow: 0 0 0 5px var(--blue-2); }
    .metric { display: flex; flex-direction: column; gap: 3px; }
    .metric strong { font-size: 24px; line-height: 1.05; letter-spacing: -.035em; }
    .metric span { color: var(--ink-3); font-size: 12px; }
    .status-line { display: flex; align-items: center; gap: 9px; }
    .status-line + .status-line { margin-top: 10px; }
    .status-icon { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); font-size: 12px; font-weight: 800; }
    .status-icon.ok { color: var(--green); background: var(--green-bg); }
    .status-icon.warn { color: var(--amber); background: var(--amber-bg); }
    .context-bits { display: flex; flex-wrap: wrap; gap: 7px; }
    .context-bits span { border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); padding: 4px 7px; color: var(--ink-2); font-size: 11px; }

    /* Variant A — Command Center */
    .a-shell { display: grid; grid-template-columns: 218px minmax(0,1fr); min-height: 100vh; }
    .a-sidebar { position: sticky; top: 0; height: 100vh; padding: 18px 14px; border-right: 1px solid var(--line); z-index: 8; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 3px 8px 20px; font-size: 15px; font-weight: 780; letter-spacing: -.012em; }
    .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(145deg,#111724,#34415e); color: #fff; box-shadow: inset 0 1px rgba(255,255,255,.25), 0 6px 16px rgba(19,31,55,.18); }
    .a-project { margin: 0 2px 18px; padding: 12px; }
    .a-project b { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-list { display: grid; gap: 5px; }
    .nav-btn { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 42px; border: 0; border-radius: 11px; background: transparent; padding: 0 11px; cursor: pointer; color: var(--ink-2); text-align: left; transition: transform 120ms var(--spring), background 150ms ease, color 150ms ease; }
    .nav-btn .nav-glyph { display: grid; place-items: center; width: 22px; height: 22px; color: var(--ink-3); font-size: 13px; }
    .nav-btn.on { background: var(--surface-solid); color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 700; }
    .nav-btn.on .nav-glyph { color: var(--blue); }
    .nav-btn .count { margin-left: auto; color: var(--red); font-size: 11px; font-weight: 800; }
    .sidebar-foot { position: absolute; bottom: 18px; left: 14px; right: 14px; }
    .a-main { min-width: 0; }
    .a-top { position: sticky; top: 0; z-index: 7; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 26px; border-bottom: 1px solid var(--line); }
    .breadcrumbs { display: flex; align-items: center; gap: 7px; min-width: 0; color: var(--ink-3); font-size: 12px; }
    .breadcrumbs b { color: var(--ink); }
    .a-content { padding: 26px clamp(18px,3vw,42px) 100px; }
    .a-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .a-heading h1 { margin: 4px 0 2px; font-size: clamp(26px,3vw,38px); line-height: 1.03; letter-spacing: -.04em; }
    .a-heading p { margin: 0; color: var(--ink-3); }
    .a-layout { display: grid; grid-template-columns: minmax(0,1fr) 310px; gap: 18px; align-items: start; }
    .a-stack { display: grid; gap: 14px; }
    .a-inspector { position: sticky; top: 78px; padding: 17px; }
    .decision-card { padding: 18px; border-left: 4px solid var(--amber); }
    .decision-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .decision-head h2 { margin: 4px 0 5px; font-size: 18px; letter-spacing: -.02em; }
    .decision-card p { color: var(--ink-2); }
    .decision-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .project-row { display: grid; grid-template-columns: minmax(180px,1.2fr) repeat(4,minmax(72px,.42fr)) 92px; gap: 12px; align-items: center; padding: 15px 16px; cursor: pointer; transition: transform 180ms var(--spring), border-color 180ms ease; }
    .project-row:hover { transform: translateY(-2px); border-color: color-mix(in srgb,var(--blue) 30%,var(--line)); }
    .project-row b { display: block; }
    .project-row small { color: var(--ink-3); }

    /* Variant B — Spatial Workspaces */
    .b-shell { min-height: 100vh; padding-bottom: 105px; }
    .b-topbar { position: sticky; top: 0; z-index: 9; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 66px; padding: 0 25px; border-bottom: 1px solid var(--line); }
    .b-topbar .brand { padding: 0; }
    .b-tabs { display: flex; align-items: center; gap: 4px; border-radius: 13px; background: color-mix(in srgb,var(--surface-solid) 56%,transparent); padding: 4px; box-shadow: inset 0 0 0 1px var(--line); }
    .b-tab { min-height: 34px; border: 0; border-radius: 10px; background: transparent; padding: 0 13px; color: var(--ink-3); cursor: pointer; font-weight: 650; }
    .b-tab.on { background: var(--surface-solid); color: var(--ink); box-shadow: 0 2px 8px rgba(20,24,35,.08); }
    .b-right { justify-self: end; display: flex; gap: 8px; }
    .b-content { max-width: 1340px; margin: 0 auto; padding: 30px clamp(18px,4vw,54px); }
    .b-hero { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(260px,.65fr); gap: 18px; align-items: stretch; margin-bottom: 18px; }
    .b-focus { position: relative; overflow: hidden; min-height: 230px; padding: 28px; color: #fff; border-radius: 26px; background: linear-gradient(135deg,#1c2a48,#2455a8 64%,#5e52c8); box-shadow: 0 24px 70px rgba(26,65,145,.22); }
    .b-focus::after { content:""; position:absolute; inset:auto -12% -65% 28%; height:250px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%); }
    .b-focus .eyebrow { color: rgba(255,255,255,.65); }
    .b-focus h1 { max-width: 680px; margin: 10px 0 9px; font-size: clamp(30px,4vw,49px); line-height: 1.01; letter-spacing: -.055em; }
    .b-focus p { max-width: 620px; color: rgba(255,255,255,.76); font-size: 15px; }
    .b-focus .btn { margin-top: 20px; border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.94); color: #163c7b; }
    .b-now { padding: 20px; }
    .b-now h2 { margin: 0; font-size: 17px; }
    .b-now .metric { margin: 18px 0; }
    .b-grid { display: grid; grid-template-columns: repeat(12,minmax(0,1fr)); gap: 16px; }
    .b-tile { min-height: 160px; padding: 18px; }
    .b-tile h3 { margin: 5px 0; font-size: 17px; letter-spacing: -.02em; }
    .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
    .b-dock { position: fixed; z-index: 12; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; padding: 6px; border: 1px solid rgba(255,255,255,.46); border-radius: 18px; box-shadow: var(--shadow-lg); }
    .b-dock button { display: grid; place-items: center; min-width: 54px; height: 46px; border: 0; border-radius: 13px; background: transparent; cursor: pointer; color: var(--ink-3); font-weight: 700; }
    .b-dock button.on { background: var(--surface-solid); color: var(--blue); box-shadow: var(--shadow-sm); }
    .b-dock small { display: block; margin-top: 2px; font-size: 9px; color: inherit; }

    /* Variant C — Journey Rail */
    .c-shell { display: grid; grid-template-rows: 74px minmax(0,1fr); min-height: 100vh; }
    .c-header { position: sticky; top: 0; z-index: 9; display: flex; align-items: center; gap: 18px; padding: 0 24px; border-bottom: 1px solid var(--line); }
    .c-header .brand { padding: 0; }
    .c-route { min-width: 0; flex: 1; display: flex; align-items: center; gap: 6px; overflow: hidden; }
    .c-route span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--ink-3); font-size: 11px; white-space: nowrap; }
    .c-route span::after { content:"›"; color: var(--line-strong); }
    .c-route span:last-child::after { display:none; }
    .c-route b { max-width: 140px; overflow:hidden; text-overflow:ellipsis; color:var(--ink); }
    .c-main { display: grid; grid-template-columns: 198px minmax(0,1fr) 350px; min-height: 0; }
    .c-chapters { position: sticky; top: 74px; height: calc(100vh - 74px); padding: 22px 14px; border-right: 1px solid var(--line); }
    .chapter { width: 100%; display: grid; grid-template-columns: 25px 1fr; align-items: center; gap: 8px; min-height: 48px; border: 0; border-radius: 12px; background: transparent; padding: 0 10px; color: var(--ink-3); text-align: left; cursor: pointer; }
    .chapter .no { font-family: ui-monospace,"SF Mono",monospace; font-size: 10px; }
    .chapter.on { background: var(--surface-solid); color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 720; }
    .chapter.on .no { color: var(--blue); }
    .c-canvas { min-width: 0; padding: 30px clamp(20px,3vw,42px) 100px; }
    .c-canvas h1 { margin: 7px 0 5px; font-size: clamp(28px,3.3vw,44px); line-height: 1.02; letter-spacing: -.05em; }
    .c-canvas > p { margin: 0 0 22px; color: var(--ink-3); font-size: 15px; }
    .c-inspector { position: sticky; top: 74px; height: calc(100vh - 74px); overflow: auto; border-left: 1px solid var(--line); padding: 22px 20px 100px; background: color-mix(in srgb,var(--surface) 72%,transparent); backdrop-filter: blur(28px) saturate(150%); }
    .c-inspector h2 { margin: 4px 0 2px; font-size: 18px; letter-spacing: -.025em; }
    .c-inspector section { padding: 15px 0; border-bottom: 1px solid var(--line); }
    .c-actions { position: sticky; bottom: 18px; z-index: 4; display: flex; align-items: center; gap: 8px; width: max-content; max-width: 100%; margin: 22px auto 0; padding: 7px; border: 1px solid rgba(255,255,255,.48); border-radius: 16px; box-shadow: var(--shadow-lg); }
    .stage-board { display: grid; grid-template-columns: repeat(7,minmax(150px,1fr)); gap: 10px; overflow-x: auto; padding: 4px 2px 12px; }
    .stage { min-height: 240px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
    .stage.current { border-color: color-mix(in srgb,var(--blue) 45%,var(--line)); box-shadow: 0 0 0 3px var(--blue-2); }
    .stage h3 { margin: 7px 0 14px; font-size: 15px; }
    .stage-item { margin-top: 8px; padding: 9px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-size: 11px; }

    /* Page content */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before { content:""; position:absolute; top:10px; bottom:10px; left:8px; width:2px; background:var(--line); }
    .event { position: relative; padding: 0 0 20px 4px; }
    .event::before { content:""; position:absolute; left:-25px; top:5px; width:10px; height:10px; border:2px solid var(--surface-solid); border-radius:50%; background:var(--green); box-shadow:0 0 0 2px var(--green-bg); }
    .event.warn::before { background:var(--amber); box-shadow:0 0 0 2px var(--amber-bg); }
    .event b { display:block; }
    .event small { color:var(--ink-3); }
    .facts { display:grid; gap:9px; }
    .fact { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:12px; }
    .fact span { color:var(--ink-3); }
    .fact b { max-width:58%; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .run-strip { display:grid; grid-template-columns:repeat(6,1fr); gap:7px; margin-top:14px; }
    .run-node { min-height:63px; padding:9px; border-radius:10px; background:var(--surface-2); color:var(--ink-3); font-size:10px; }
    .run-node.done { background:var(--green-bg); color:var(--green); }
    .run-node.current { background:var(--amber-bg); color:var(--amber); }
    .run-node b { display:block; margin-top:4px; font-size:11px; }
    .readiness-grid { display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:12px; }
    .ready-card { min-height:135px; padding:16px; }
    .ready-card .big-check { display:grid; place-items:center; width:32px; height:32px; border-radius:10px; background:var(--green-bg); color:var(--green); font-weight:900; }
    .ready-card h3 { margin:14px 0 3px; font-size:15px; }
    .ready-card p { margin:0; color:var(--ink-3); font-size:11px; }
    .ops-columns { display:grid; grid-template-columns:repeat(4,minmax(190px,1fr)); gap:12px; overflow-x:auto; }
    .ops-col { min-height:390px; padding:14px; }
    .ops-col h3 { margin:0 0 12px; font-size:13px; }
    .task { margin-bottom:10px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--surface-solid); cursor:pointer; transition:transform 160ms var(--spring),box-shadow 160ms ease; }
    .task:hover { transform:translateY(-2px); box-shadow:var(--shadow-sm); }
    .task b { display:block; font-size:12px; }
    .task small { display:block; margin-top:5px; color:var(--ink-3); }
    .split-editor { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(310px,.75fr); gap:14px; }
    .inspector-form { padding:17px; }
    .field { margin-top:14px; }
    .field label { display:block; margin-bottom:6px; color:var(--ink-3); font-size:11px; font-weight:700; }
    .field input, .field select, .field textarea { width:100%; min-height:38px; border:1px solid var(--line-strong); border-radius:10px; background:var(--surface-solid); color:var(--ink); padding:9px 11px; outline:none; }
    .field textarea { min-height:95px; resize:none; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-2); }

    /* Prototype switcher */
    .prototype-switcher { position:fixed; z-index:60; left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:5px; padding:5px; border:1px solid rgba(255,255,255,.28); border-radius:16px; background:rgba(17,19,24,.88); color:#fff; box-shadow:0 18px 60px rgba(0,0,0,.32); backdrop-filter:blur(24px) saturate(150%); }
    .prototype-switcher button { width:38px; height:36px; border:0; border-radius:11px; background:transparent; color:#fff; cursor:pointer; font-size:17px; }
    .prototype-switcher button:hover { background:rgba(255,255,255,.12); }
    .variant-label { min-width:220px; padding:0 12px; text-align:center; font-size:12px; }
    .variant-label b { display:block; font-size:13px; letter-spacing:-.01em; }
    .variant-label span { color:rgba(255,255,255,.58); }

    /* Demo sheet: direct, interruptible and draggable */
    .sheet-backdrop { position:fixed; z-index:50; inset:0; display:none; align-items:flex-end; justify-content:center; background:rgba(8,10,15,.22); backdrop-filter:blur(7px); opacity:0; }
    .sheet-backdrop.open { display:flex; }
    .demo-sheet { width:min(720px,calc(100vw - 20px)); max-height:min(74vh,720px); overflow:auto; border:1px solid rgba(255,255,255,.55); border-radius:24px 24px 0 0; background:var(--surface-solid); box-shadow:var(--shadow-lg); padding:10px 24px 34px; transform:translateY(110%); touch-action:none; will-change:transform; }
    .sheet-handle { width:42px; height:5px; margin:2px auto 18px; border-radius:99px; background:var(--line-strong); cursor:grab; }
    .sheet-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    .sheet-head h2 { margin:4px 0 4px; font-size:24px; letter-spacing:-.035em; }
    .sheet-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
    .sheet-grid .soft { padding:14px; }

    @media (max-width: 1040px) {
      .a-layout { grid-template-columns:1fr; }
      .a-inspector { position:static; }
      .c-main { grid-template-columns:170px minmax(0,1fr); }
      .c-inspector { display:none; }
      .b-hero { grid-template-columns:1fr; }
      .span-4,.span-5,.span-7,.span-8 { grid-column:span 6; }
      .readiness-grid { grid-template-columns:repeat(3,minmax(130px,1fr)); }
    }
    @media (max-width: 760px) {
      .a-shell { grid-template-columns:1fr; }
      .a-sidebar { position:fixed; left:10px; right:10px; top:auto; bottom:74px; height:58px; display:flex; align-items:center; padding:6px; border:1px solid rgba(255,255,255,.5); border-radius:18px; box-shadow:var(--shadow-lg); }
      .a-sidebar .brand,.a-project,.sidebar-foot { display:none; }
      .a-sidebar .nav-list { width:100%; grid-template-columns:repeat(5,1fr); }
      .a-sidebar .nav-btn { justify-content:center; min-height:44px; padding:0; }
      .a-sidebar .nav-btn span:not(.nav-glyph):not(.count) { display:none; }
      .a-top { height:54px; padding:0 14px; }
      .a-content,.b-content,.c-canvas { padding:20px 14px 150px; }
      .a-heading { align-items:flex-start; flex-direction:column; }
      .project-row { grid-template-columns:1fr 60px 60px; }
      .project-row .hide-mobile { display:none; }
      .b-topbar { grid-template-columns:1fr auto; padding:0 14px; }
      .b-tabs { display:none; }
      .b-focus { min-height:260px; padding:22px; }
      .span-4,.span-5,.span-7,.span-8,.span-12 { grid-column:span 12; }
      .c-shell { grid-template-rows:58px 1fr; }
      .c-header { padding:0 14px; }
      .c-route { display:none; }
      .c-main { display:block; }
      .c-chapters { position:fixed; z-index:12; top:auto; left:10px; right:10px; bottom:74px; height:58px; display:grid; grid-template-columns:repeat(5,1fr); padding:6px; border:1px solid rgba(255,255,255,.5); border-radius:18px; box-shadow:var(--shadow-lg); }
      .chapter { display:flex; justify-content:center; min-height:44px; padding:0; }
      .chapter .no { display:none; }
      .chapter span:last-child { font-size:11px; }
      .readiness-grid { grid-template-columns:1fr 1fr; }
      .split-editor { grid-template-columns:1fr; }
      .run-strip { grid-template-columns:repeat(3,1fr); }
      .prototype-switcher { bottom:10px; }
      .variant-label { min-width:158px; }
      .sheet-grid { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
      .page-in { animation:none; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .glass,.prototype-switcher,.c-inspector { backdrop-filter:none; -webkit-backdrop-filter:none; background:var(--surface-solid); }
      .prototype-switcher { background:#1b1d22; }
    }
    @media (prefers-contrast: more) {
      :root { --line:rgba(20,22,28,.28); --line-strong:rgba(20,22,28,.46); }
      .glass,.card { background:var(--surface-solid); }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div class="prototype-switcher" aria-label="原型方案切换器">
    <button id="prevVariant" aria-label="上一个方案">←</button>
    <div class="variant-label"><b id="variantName"></b><span>← → 键切换 · Demo only</span></div>
    <button id="nextVariant" aria-label="下一个方案">→</button>
  </div>
  <div id="sheetBackdrop" class="sheet-backdrop" aria-hidden="true">
    <aside id="demoSheet" class="demo-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div id="sheetHandle" class="sheet-handle" aria-label="向下拖动关闭"></div>
      <div id="sheetBody"></div>
    </aside>
  </div>

  <script>
    const variants = [
      { id: 'A', name: 'A · Command Center', note: '稳定侧栏 + 主任务 + 事实检查器' },
      { id: 'B', name: 'B · Spatial Workspaces', note: '空间卡片 + 浮动 Dock' },
      { id: 'C', name: 'C · Journey Rail', note: '用户旅程主轴 + 常驻检查器' },
    ]
    const pages = [
      { id: 'overview', label: '总览', glyph: '◫', count: '1' },
      { id: 'change', label: '交付', glyph: '↗', count: '' },
      { id: 'studio', label: '编排', glyph: '⌘', count: '' },
      { id: 'operations', label: '运行', glyph: '▶', count: '1' },
      { id: 'machine', label: '机器', glyph: '◎', count: '' },
    ]
    const variantNames = Object.fromEntries(variants.map(v => [v.id, v]))
    const state = {
      variant: new URLSearchParams(location.search).get('variant') || 'A',
      page: new URLSearchParams(location.search).get('page') || 'overview',
      dark: false,
    }
    if (!variantNames[state.variant]) state.variant = 'A'
    if (!pages.some(p => p.id === state.page)) state.page = 'overview'

    const app = document.getElementById('app')
    const variantName = document.getElementById('variantName')
    const sheetBackdrop = document.getElementById('sheetBackdrop')
    const demoSheet = document.getElementById('demoSheet')
    const sheetBody = document.getElementById('sheetBody')
    const sheetHandle = document.getElementById('sheetHandle')

    function route(next, replace = false) {
      Object.assign(state, next)
      const url = new URL(location.href)
      url.searchParams.set('variant', state.variant)
      url.searchParams.set('page', state.page)
      history[replace ? 'replaceState' : 'pushState']({}, '', url)
      render()
    }

    function navButtons(kind) {
      return pages.map((p, i) => {
        if (kind === 'b') return `<button class="b-tab ${state.page === p.id ? 'on' : ''}" data-page="${p.id}">${p.label}${p.count ? ` · ${p.count}` : ''}</button>`
        if (kind === 'c') return `<button class="chapter ${state.page === p.id ? 'on' : ''}" data-page="${p.id}"><span class="no">0${i+1}</span><span>${p.label}</span></button>`
        return `<button class="nav-btn ${state.page === p.id ? 'on' : ''}" data-page="${p.id}"><span class="nav-glyph">${p.glyph}</span><span>${p.label}</span>${p.count ? `<span class="count">${p.count}</span>` : ''}</button>`
      }).join('')
    }

    function contextLine() {
      return `<div class="breadcrumbs"><b>pipeline-worklfow</b><span>›</span><span>ui-real-browser</span><span>›</span><span>frontend</span><span>›</span><span>default</span><span>›</span><span>验证</span></div>`
    }

    function pageTitle() {
      const map = {
        overview: ['今天先处理什么', '跨项目晨检把唯一需要你介入的事项放在最前面。'],
        change: ['ui-real-browser', '从当前状态到下一动作，再到不可变 Run 证据。'],
        studio: ['编排工作室', 'Track 负责路由，Workflow 负责执行，Step 负责具体契约。'],
        operations: ['运行中心', 'Loop、AFK、Triage 与 Sync 共用一条真实执行链。'],
        machine: ['机器与依赖', '先确认环境能运行，再允许启动真实 Codex / Docker。'],
      }
      return map[state.page]
    }

    function journeyMap(current = 3) {
      const items = ['准备','创建','执行','验证','决定','审计']
      return `<div class="journey-map">${items.map((x,i)=>`<div class="journey-step ${i < current ? 'done' : i === current ? 'current' : ''}">${x}</div>`).join('')}</div>`
    }

    function overviewMain(compact = false) {
      return `
        <div class="a-stack">
          <section class="card decision-card pressable" data-sheet="decision">
            <div class="decision-head"><div><span class="eyebrow">Needs your decision</span><h2>验证结果缺少可信签发者</h2></div><span class="pill amber"><i class="dot"></i>已暂停</span></div>
            <p><span class="mono">ui-real-browser</span> 已完成真实 Codex / Docker 执行，但 H7 verification fail-closed；没有发生误合并。</p>
            ${journeyMap(4)}
            <div class="decision-actions"><button class="btn primary" data-page="change">查看证据并决定</button><button class="btn" data-sheet="run">打开 Run</button></div>
          </section>
          <section class="card" style="padding:8px">
            <div class="project-row pressable" data-page="change">
              <div><b>pipeline-worklfow</b><small>3 个在制变更 · 刚刚刷新</small></div>
              <div class="metric"><strong style="color:var(--amber)">1</strong><span>需要你</span></div>
              <div class="metric"><strong>0</strong><span>运行中</span></div>
              <div class="metric hide-mobile"><strong>2</strong><span>等待中</span></div>
              <div class="metric hide-mobile"><strong style="color:var(--green)">✓</strong><span>账本健康</span></div>
              <button class="btn quiet">打开 →</button>
            </div>
          </section>
          ${compact ? '' : `<section class="card" style="padding:18px"><div class="decision-head"><div><span class="eyebrow">Recent success</span><h2 style="margin:5px 0">H14 真实运行门已通过</h2></div><span class="pill green">10 / 10</span></div><p class="muted">真实 Codex、L3 merge、budget-before-Docker 均零跳过。</p></section>`}
        </div>`
    }

    function changeMain() {
      return `
        <section class="card" style="padding:20px">
          <div class="decision-head"><div><div class="context-bits"><span>Track · frontend</span><span>Workflow · default</span><span>Step · verify</span></div><h2 style="margin:12px 0 4px;font-size:24px;letter-spacing:-.035em">真实执行完成，等待可信验证</h2><p class="muted">下一动作不会由 UI 猜测；系统先展示将写入的状态与证据。</p></div><span class="pill amber"><i class="dot"></i>等待决定</span></div>
          ${journeyMap(4)}
          <div class="decision-actions"><button class="btn primary" data-sheet="decision">查看验证证据</button><button class="btn">重新入队</button><button class="btn">接管现场</button><button class="btn danger">停止</button></div>
        </section>
        <section class="card" style="padding:20px;margin-top:14px">
          <div class="decision-head"><div><span class="eyebrow">Canonical run timeline</span><h2 style="margin:5px 0 20px">Run 01JZ…B7A</h2></div><span class="pill green">Ledger 健康</span></div>
          <div class="timeline">
            <div class="event"><b>Reservation activated</b><small class="mono">attempt_003 · owner codex · L1</small></div>
            <div class="event"><b>Skill bundle frozen</b><small class="mono">frontend · sha256:e2e…digest · 5 slots</small></div>
            <div class="event"><b>Provider usage charged</b><small class="mono">78,635 tokens · actual</small></div>
            <div class="event"><b>Git artifact created</b><small class="mono">commit b389cb806e26… · worktree preserved</small></div>
            <div class="event warn"><b>Verification paused</b><small>issuer 不满足 trusted binding，fail-closed</small></div>
          </div>
        </section>`
    }

    function studioMain() {
      return `
        <div class="split-editor">
          <section class="card" style="padding:16px;overflow:hidden">
            <div class="decision-head"><div><span class="eyebrow">Workflow · default</span><h2 style="margin:4px 0">7 阶段执行脊</h2></div><span class="pill">内置 · 只读</span></div>
            <div class="stage-board" style="margin-top:16px">
              ${['立项','调研','规格','实现','验证','交付','归档'].map((x,i)=>`<article class="stage ${i===4?'current':''}"><span class="eyebrow">0${i+1}</span><h3>${x}</h3><div class="stage-item">${i===4?'5 个强制技能':'Hook 8 开 · 2 锁'}</div><div class="stage-item">${[1,2,4].includes(i)?'复核门':'固定产出契约'}</div>${i===4?'<div class="stage-item" style="color:var(--blue)">当前选择</div>':''}</article>`).join('')}
            </div>
          </section>
          <section class="card inspector-form">
            <span class="eyebrow">Step inspector</span><h2 style="margin:5px 0 2px">验证 · 完整执行契约</h2><p class="muted">意图 → 技能 → Hooks → 产物 → 门与转换 → 自动运行</p>
            <div class="field"><label>Codex Prompt</label><textarea>验证实现、运行真实测试，并给出证据绑定的结论。</textarea></div>
            <div class="field"><label>Gate</label><select><option>review · trusted verifier required</option></select></div>
            <div class="field"><label>Effective skills</label><div class="context-bits"><span>browser-qa</span><span>web-design-guidelines</span><span>handoff</span></div></div>
            <div class="decision-actions"><button class="btn primary">保存 Workflow</button><button class="btn" data-sheet="policy">预览 Effective Policy</button></div>
          </section>
        </div>`
    }

    function operationsMain() {
      return `
        <section class="card" style="padding:18px;margin-bottom:14px">
          <div class="decision-head"><div><span class="eyebrow">Global cadence</span><h2 style="margin:5px 0">调度器在线 · 30s poll</h2><p class="muted">只相信 durable ledger 与真实 CLI exit code。</p></div><button class="btn" data-sheet="run">运行一次</button></div>
        </section>
        <div class="ops-columns">
          <section class="card ops-col"><h3>排队中 · 1</h3><div class="task" data-sheet="run"><b>ui-real-e2e</b><small>codex · L1 · 等待 reservation</small></div></section>
          <section class="card ops-col"><h3>运行中 · 0</h3><div class="soft" style="padding:18px;text-align:center;color:var(--ink-3)">没有正在运行的任务</div></section>
          <section class="card ops-col"><h3>需要处理 · 1</h3><div class="task" data-page="change"><b>ui-real-browser</b><small style="color:var(--amber)">verification-binding-unresolved</small></div></section>
          <section class="card ops-col"><h3>最近完成</h3><div class="task"><b>H14 real-Codex</b><small style="color:var(--green)">10 / 10 · exit 0</small></div></section>
        </div>
        <div class="decision-actions"><button class="btn">从 Starter 创建 Loop</button><button class="btn">Codex Triage</button><button class="btn">生成 Sync Plan</button></div>`
    }

    function machineMain() {
      return `
        <div class="readiness-grid">
          ${[['Docker','7 个本机镜像'],['沙箱镜像','sandcastle:local'],['Codex 凭证','default-home'],['技能包','66 / 67 已安装'],['生产操作','Server 已接线']].map(([a,b])=>`<section class="card ready-card"><span class="big-check">✓</span><h3>${a}</h3><p>${b}</p></section>`).join('')}
        </div>
        <div class="split-editor" style="margin-top:14px">
          <section class="card" style="padding:18px"><span class="eyebrow">当前阻断</span><h2 style="margin:6px 0">没有机器级阻断</h2><p class="muted">optional skill <span class="mono">zoom-out</span> 不可用，但不阻断真实执行。</p></section>
          <section class="card" style="padding:18px"><span class="eyebrow">跨项目风险</span><div class="status-line" style="margin-top:12px"><span class="status-icon warn">!</span><div><b>UI Real Codex E2E</b><div class="muted">readiness mostly-ready</div></div><button class="btn quiet" data-page="change" style="margin-left:auto">打开</button></div></section>
        </div>`
    }

    function currentMain() {
      if (state.page === 'overview') return overviewMain()
      if (state.page === 'change') return changeMain()
      if (state.page === 'studio') return studioMain()
      if (state.page === 'operations') return operationsMain()
      return machineMain()
    }

    function inspectorContent() {
      const common = `<section><span class="eyebrow">Current context</span><div class="facts"><div class="fact"><span>Project</span><b>pipeline-worklfow</b></div><div class="fact"><span>Change</span><b>ui-real-browser</b></div><div class="fact"><span>Track</span><b>frontend</b></div><div class="fact"><span>Workflow</span><b>default</b></div><div class="fact"><span>Step</span><b>verify</b></div></div></section>`
      if (state.page === 'machine') return `<section><span class="eyebrow">Readiness</span><h2>5 项运行条件</h2><p class="muted">信号全部来自真实 API，不用测试替身。</p></section>${common}`
      if (state.page === 'studio') return `<section><span class="eyebrow">Selection</span><h2>Step · verify</h2><p class="muted">所有编辑都定位到当前 Step，不用多层 modal。</p></section>${common}`
      if (state.page === 'operations') return `<section><span class="eyebrow">Next scheduled</span><h2>ui-real-e2e</h2><p class="muted">due 05:06 UTC · codex · L1</p></section>${common}`
      return `<section><span class="eyebrow">Why now</span><h2>可信验证未成立</h2><p class="muted">系统已自动暂停；需要人工确认下一步。</p></section>${common}<section><span class="eyebrow">Evidence</span><div class="facts"><div class="fact"><span>Issuer</span><b>untrusted</b></div><div class="fact"><span>Subject SHA</span><b class="mono">b389cb…</b></div><div class="fact"><span>Skill bundle</span><b class="mono">e2e…digest</b></div><div class="fact"><span>Usage</span><b>78,635 actual</b></div></div></section>`
    }

    function renderA() {
      const [title,subtitle] = pageTitle()
      return `<div class="a-shell">
        <aside class="a-sidebar glass"><div class="brand"><span class="brand-mark">P</span>Pipeline</div><div class="a-project soft"><span class="eyebrow">当前项目</span><b>pipeline-worklfow</b><small class="muted">事实已连接</small></div><nav class="nav-list">${navButtons('a')}</nav><div class="sidebar-foot"><button class="nav-btn" data-theme><span class="nav-glyph">◐</span><span>外观</span></button></div></aside>
        <div class="a-main"><header class="a-top glass">${contextLine()}<span style="margin-left:auto" class="pill green"><i class="dot"></i>实时</span></header><main class="a-content page-in"><div class="a-heading"><div><span class="eyebrow">${state.page}</span><h1>${title}</h1><p>${subtitle}</p></div>${state.page==='overview'?'<button class="btn primary" data-sheet="create">＋ 新建 Change</button>':''}</div><div class="a-layout"><div>${currentMain()}</div><aside class="card a-inspector">${inspectorContent()}</aside></div></main></div>
      </div>`
    }

    function renderB() {
      const [title,subtitle] = pageTitle()
      const heroAction = state.page === 'overview' ? '查看唯一阻断' : state.page === 'studio' ? '打开当前 Step' : state.page === 'operations' ? '运行一次' : '查看事实'
      return `<div class="b-shell"><header class="b-topbar glass"><div class="brand"><span class="brand-mark">P</span>Pipeline</div><nav class="b-tabs">${navButtons('b')}</nav><div class="b-right"><button class="btn" data-theme>◐</button><span class="pill green"><i class="dot"></i>实时</span></div></header>
        <main class="b-content page-in"><div class="b-hero"><section class="b-focus"><span class="eyebrow">${state.page} · pipeline-worklfow</span><h1>${title}</h1><p>${subtitle}</p><button class="btn" ${state.page==='overview'?'data-page="change"':'data-sheet="decision"'}>${heroAction} →</button></section><aside class="card b-now"><span class="eyebrow">Now</span><h2>系统已替你停在安全点</h2><div class="metric"><strong style="color:var(--amber)">1</strong><span>需要人工决定</span></div><div class="status-line"><span class="status-icon ok">✓</span><div><b>Ledger 健康</b><div class="muted">事实可追溯</div></div></div></aside></div>
        <div class="b-grid">${state.page==='overview' ? `<section class="span-8">${overviewMain(true)}</section><section class="card b-tile span-4">${inspectorContent()}</section><section class="card b-tile span-12">${journeyMap(4)}</section>` : `<section class="span-8">${currentMain()}</section><aside class="card b-tile span-4">${inspectorContent()}</aside>`}</div></main>
        <nav class="b-dock glass">${pages.map(p=>`<button class="${state.page===p.id?'on':''}" data-page="${p.id}">${p.glyph}<small>${p.label}</small></button>`).join('')}</nav></div>`
    }

    function renderC() {
      const [title,subtitle] = pageTitle()
      return `<div class="c-shell"><header class="c-header glass"><div class="brand"><span class="brand-mark">P</span>Pipeline</div><div class="c-route"><span><b>pipeline-worklfow</b></span><span><b>ui-real-browser</b></span><span>frontend</span><span>default</span><span>verify</span><span class="mono">Run 01JZ…B7A</span></div><button class="btn" data-theme>◐</button><span class="pill green"><i class="dot"></i>实时</span></header>
        <div class="c-main"><nav class="c-chapters">${navButtons('c')}</nav><main class="c-canvas page-in"><span class="eyebrow">Journey · ${state.page}</span><h1>${title}</h1><p>${subtitle}</p>${currentMain()}<div class="c-actions glass"><button class="btn primary" data-sheet="decision">下一步</button><button class="btn" data-sheet="run">Run 证据</button><button class="btn quiet" data-page="overview">返回总览</button></div></main><aside class="c-inspector">${inspectorContent()}</aside></div></div>`
    }

    function render() {
      app.innerHTML = state.variant === 'A' ? renderA() : state.variant === 'B' ? renderB() : renderC()
      variantName.textContent = `${variantNames[state.variant].name} — ${variantNames[state.variant].note}`
      document.documentElement.classList.toggle('dark', state.dark)
      bindActions()
    }

    function bindActions() {
      app.querySelectorAll('[data-page]').forEach(el => el.addEventListener('click', e => {
        e.stopPropagation(); route({ page: el.dataset.page })
      }))
      app.querySelectorAll('[data-sheet]').forEach(el => el.addEventListener('click', e => {
        e.stopPropagation(); openSheet(el.dataset.sheet)
      }))
      app.querySelectorAll('[data-theme]').forEach(el => el.addEventListener('click', () => { state.dark = !state.dark; render() }))
    }

    const sheetContent = {
      decision: () => `<div class="sheet-head"><div><span class="eyebrow">Decision preview</span><h2 id="sheetTitle">确认下一步之前，先看系统会做什么</h2><p class="muted">这是只读 Demo；生产设计里动作必须先展示 phase、写入与执行影响。</p></div><button class="btn quiet" data-close>✕</button></div><div class="sheet-grid"><div class="soft"><b>保持暂停</b><p class="muted">不写状态、不启动执行；现场继续保留。</p></div><div class="soft"><b>重新入队</b><p class="muted">创建新 Attempt，沿用冻结的 policy 与 skill bundle。</p></div><div class="soft"><b>接管现场</b><p class="muted">打开 worktree / session，不修改历史事实。</p></div><div class="soft"><b style="color:var(--red)">停止运行</b><p class="muted">写 terminal reason，并释放 reservation。</p></div></div><div class="decision-actions"><button class="btn primary" data-close>我知道了</button><button class="btn" data-page="change">打开完整证据</button></div>`,
      run: () => `<div class="sheet-head"><div><span class="eyebrow">Run once</span><h2 id="sheetTitle">定向运行 ui-real-e2e</h2><p class="muted">默认 dry-run；真实运行需确认 Docker、Verifier、Skill snapshot 与预算结算。</p></div><button class="btn quiet" data-close>✕</button></div><div class="field"><label>Loop</label><select><option>ui-real-e2e · waiting</option></select></div><div class="field"><label>Level</label><select><option>L1 · 仅报告</option><option>L2 · 辅助</option><option>L3 · 无人值守</option></select></div><div class="run-strip"><div class="run-node done">01<b>准入</b></div><div class="run-node done">02<b>预占</b></div><div class="run-node current">03<b>执行</b></div><div class="run-node">04<b>验证</b></div><div class="run-node">05<b>合并</b></div><div class="run-node">06<b>结算</b></div></div><div class="decision-actions"><button class="btn primary" data-close>预演</button><button class="btn" data-close>取消</button></div>`,
      create: () => `<div class="sheet-head"><div><span class="eyebrow">Create change</span><h2 id="sheetTitle">名字与目标就够了</h2><p class="muted">Router 会推荐 Track，并解释 Workflow、Policy 与 Skills 的来源。</p></div><button class="btn quiet" data-close>✕</button></div><div class="field"><label>Change name</label><input value="improve-run-audit" /></div><div class="field"><label>目标</label><textarea>让用户在 30 秒内看懂一次真实运行发生了什么。</textarea></div><div class="soft" style="padding:14px;margin-top:14px"><span class="pill blue">推荐 frontend</span><p>命中 <span class="mono">ui-* / frontend-* </span> pattern · priority 80 · workflow default · 首步 open。</p></div><div class="decision-actions"><button class="btn primary" data-page="change">创建并进入详情</button><button class="btn" data-close>取消</button></div>`,
      policy: () => `<div class="sheet-head"><div><span class="eyebrow">Effective policy</span><h2 id="sheetTitle">运行时最终看到的约束</h2><p class="muted">继承来源明确到 Track / Workflow / Step；不可编辑的 kernel 规则不会伪装成开关。</p></div><button class="btn quiet" data-close>✕</button></div><div class="facts"><div class="fact"><span>Automation</span><b>eligible · L1</b></div><div class="fact"><span>Human gate</span><b>verify · required</b></div><div class="fact"><span>Verifier</span><b>trusted issuer required</b></div><div class="fact"><span>Skill profile</span><b>frontend</b></div><div class="fact"><span>Daily budget</span><b>100k tokens</b></div></div>`,
    }

    let springSequence = 0
    function currentTranslateY(el) {
      const transform = getComputedStyle(el).transform
      if (!transform || transform === 'none') return 0
      const values = transform.match(/matrix(?:3d)?\((.+)\)/)?.[1]?.split(',').map(Number) || []
      return transform.startsWith('matrix3d') ? (values[13] || 0) : (values[5] || 0)
    }
    function animateSpring(el, from, to, velocity = 0, done) {
      const sequence = ++springSequence
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.style.transform = `translateY(${to}px)`; done?.(); return }
      let x = from, v = velocity, last = performance.now()
      const stiffness = 430, damping = 40
      function tick(now) {
        if (sequence !== springSequence) return
        const dt = Math.min((now-last)/1000,.032); last = now
        const a = -stiffness*(x-to)-damping*v; v += a*dt; x += v*dt
        el.style.transform = `translateY(${x}px)`
        if (Math.abs(v)<2 && Math.abs(x-to)<.6) { el.style.transform=`translateY(${to}px)`; done?.(); return }
        requestAnimationFrame(tick)
      }
      requestAnimationFrame(tick)
    }

    function openSheet(kind) {
      sheetBody.innerHTML = (sheetContent[kind] || sheetContent.decision)()
      sheetBackdrop.classList.add('open'); sheetBackdrop.setAttribute('aria-hidden','false')
      sheetBackdrop.style.opacity = '1'; demoSheet.style.transform = `translateY(${innerHeight*.8}px)`
      requestAnimationFrame(() => animateSpring(demoSheet, currentTranslateY(demoSheet), 0, 0))
      sheetBody.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',closeSheet))
      sheetBody.querySelectorAll('[data-page]').forEach(x=>x.addEventListener('click',()=>{ closeSheet(); route({page:x.dataset.page}) }))
    }
    function closeSheet(velocity = 0) {
      const y = currentTranslateY(demoSheet)
      animateSpring(demoSheet, y, innerHeight*.88, Math.max(velocity,0), () => {
        sheetBackdrop.classList.remove('open'); sheetBackdrop.setAttribute('aria-hidden','true'); sheetBackdrop.style.opacity='0'
      })
    }
    sheetBackdrop.addEventListener('click', e => { if (e.target === sheetBackdrop) closeSheet() })
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && sheetBackdrop.classList.contains('open')) return closeSheet()
      if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return
      if (e.key === 'ArrowLeft') cycleVariant(-1)
      if (e.key === 'ArrowRight') cycleVariant(1)
    })

    let drag = null
    sheetHandle.addEventListener('pointerdown', e => {
      springSequence++
      sheetHandle.setPointerCapture(e.pointerId)
      const currentY = currentTranslateY(demoSheet)
      drag = { startY:e.clientY, baseY:currentY, y:currentY, lastY:e.clientY, lastT:performance.now(), velocity:0 }
    })
    sheetHandle.addEventListener('pointermove', e => {
      if (!drag) return
      const now=performance.now(), dt=Math.max(1,now-drag.lastT)
      drag.velocity=(e.clientY-drag.lastY)/dt*1000; drag.lastY=e.clientY; drag.lastT=now
      const raw=drag.baseY+e.clientY-drag.startY
      const y=raw<0 ? (raw*240*.55)/(240+.55*Math.abs(raw)) : raw
      drag.y=y; demoSheet.style.transform=`translateY(${y}px)`
    })
    function endDrag() {
      if (!drag) return
      const d=drag; drag=null
      const projected=d.y+(d.velocity/1000)*.99/(1-.99)
      if (projected>170 || d.velocity>650) closeSheet(d.velocity)
      else animateSpring(demoSheet,d.y,0,d.velocity)
    }
    sheetHandle.addEventListener('pointerup',endDrag)
    sheetHandle.addEventListener('pointercancel',endDrag)

    function cycleVariant(delta) {
      const index=variants.findIndex(v=>v.id===state.variant)
      route({variant:variants[(index+delta+variants.length)%variants.length].id},true)
    }
    document.getElementById('prevVariant').addEventListener('click',()=>cycleVariant(-1))
    document.getElementById('nextVariant').addEventListener('click',()=>cycleVariant(1))
    addEventListener('popstate',()=>{
      const q=new URLSearchParams(location.search); state.variant=q.get('variant')||'A'; state.page=q.get('page')||'overview'; render()
    })
    render()
  </script>
</body>
</html>
