# templates/skill-sources.yaml — packaged default-workflow skill inventory
#
# This is the single source of truth for the skills a new Tenon user receives.  Every default
# requirement is first-party and lives under this plugin's `skills/` tree; setup therefore never
# downloads a mandatory skill from npm, a third-party marketplace, or another host's cache.
#
# Optional ecosystem integrations may be documented separately, but they cannot appear here as a
# mandatory dependency.  The narrow parser in packages/kernel/src/skills/source-registry.ts reads
# one `token: { ... }` mapping per line.
version: 2

skills:
