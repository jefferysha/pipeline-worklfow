name: simple
review_budget:
  version: v1
  max_attempts: 2
steps:
  - id: change
    label: Change
    gate: null
    skills:
      - id: simple-task
    inputs: []
    outputs: []
    guards: []
    transitions:
      - event: change-complete
        to: verify
      - event: scope-expanded
        to: escalated
        actions:
          - type: archive-run
  - id: verify
    label: Verify
    gate: null
    review_lanes: [e2e]
    skills:
      - id: verification-before-completion
        kind: review
        review_lane: e2e
    inputs: []
    outputs: []
    guards: []
    transitions:
      - event: verify-pass
        to: done
        actions:
          - type: mark-verification-passed
          - type: archive-run
      - event: verify-fail
        to: change
        actions:
          - type: mark-verification-failed
      - event: scope-expanded
        to: escalated
        actions:
          - type: archive-run
  - id: done
    label: Done
    gate: null
    skills: []
    inputs: []
    outputs: []
    guards: []
    transitions: []
  - id: escalated
    label: Escalated
    gate: null
    skills: []
    inputs: []
    outputs: []
    guards: []
    transitions: []
